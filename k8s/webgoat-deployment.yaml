apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgoat-app
  labels:
    app: webgoat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webgoat
  template:
    metadata:
      labels:
        app: webgoat
    spec:
      containers:
        - name: webgoat
          image: 192.168.132.130:8083/webgoat-app:latest
          ports:
            - containerPort: 8080
            - containerPort: 9090
